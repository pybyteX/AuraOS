name: Build Custom Minux Kernel

on:
  workflow_dispatch: # Allows you to manually start the build from GitHub's Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Install the tools needed to compile a kernel
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libelf-dev libssl-dev dwarves flex bison

      # 2. Download the Linux Kernel source (Minux uses 6.18.6) [citation:1]
      - name: Download Kernel Source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.8.tar.xz
          tar -xf linux-6.18.8.tar.xz
          cd linux-6.18.8

      # 3. Get Minux's official kernel configuration [citation:1]
      - name: Get Minux Kernel Config
        run: |
          cd linux-6.18.8
          wget -O .config https://raw.githubusercontent.com/imycroft/minux/main/kernel/config

      # 4. Enable the 'epoll' feature for Docker and Neovim
      - name: Enable epoll
        run: |
          cd linux-6.18.8
          scripts/config --enable EPOLL

      # 5. Compile the kernel (the long part, but fast on GitHub's servers!)
      - name: Build Kernel
        run: |
          cd linux-6.18.8
          make -j$(nproc) bzImage
          make -j$(nproc) modules

      # 6. Upload the finished kernel as a downloadable file
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: my-minux-kernel
          path: |
            linux-6.18.8/arch/x86/boot/bzImage
            linux-6.18.8/modules/
